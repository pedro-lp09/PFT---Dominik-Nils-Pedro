<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixkosten Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            padding-top: 40px;
        }
        .app-container { max-width: 900px; margin: auto; }
        .glass-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            border: none;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .btn-add {
            background-color: var(--primary-color);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
        .table tbody tr {
            background: white;
            transition: 0.2s;
        }
        .table tbody tr:hover {
            background-color: #fafbff;
        }
        .date-badge {
            background: #eef2ff;
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .btn-delete-icon {
            color: #ef233c;
            background: #fff1f2;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-decoration: none;
        }
        .btn-delete-icon:hover {
            background: #ef233c;
            color: white;
        }
    </style>
</head>
<body>

<div class="app-container px-3">
    <div class="glass-card">
        <div class="header-section">
            <div>
                <h1 class="h3 fw-bold m-0 text-primary">📊 Fixkosten-Planer</h1>
                <p class="text-muted small">Behalte deine Ausgaben im Griff</p>
            </div>
            <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm text-muted">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
            </a>
        </div>

        <form method="POST" class="row g-3 mb-5 p-3 bg-light rounded-4">
            <div class="col-md-6">
                <label class="form-label small fw-bold">Bezeichnung</label>
                <input type="text" name="contents" class="form-control" placeholder="z.B. Netflix" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Fälligkeit</label>
                <input type="date" name="due_at" class="form-control" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary btn-add w-100">Plus</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr class="text-muted small">
                        <th>FIXKOSTEN</th>
                        <th>DATUM</th>
                        <th class="text-end">AKTION</th>
                    </tr>
                </thead>
                <tbody>
                    {% for todo in todos %}
                    <tr>
                        <td class="fw-bold">{{ todo.content }}</td>
                        <td>
                            <span class="date-badge">
                                {{ todo.due if todo.due else todo.due_at }}
                            </span>
                        </td>
                        <td class="text-end">
                            <a href="{{ url_for('delete', todo_id=todo.id) }}" 
                               class="btn-delete-icon"
                               onclick="return confirm('Wirklich löschen?')">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center py-5 text-muted small">
                            Noch keine Einträge vorhanden.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
