<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Fixkosten</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-logout { float: right; }
    </style>
</head>
<body>

<div class="container">
    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm btn-logout">Abmelden</a>
    <h2 class="mb-4">📊 Meine Fixkosten</h2>

    <form method="POST" class="row g-3 mb-4">
        <div class="col-md-6">
            <input type="text" name="contents" class="form-control" placeholder="z.B. Miete oder Netflix" required>
        </div>
        <div class="col-md-4">
            <input type="date" name="due_at" class="form-control" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Hinzufügen</button>
        </div>
    </form>

    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>Beschreibung</th>
                <th>Fällig am</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr>
                <td>{{ todo[1] }}</td>
                <td>{{ todo[2] }}</td>
                <td><span class="badge bg-success">Geplant</span></td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center text-muted">Noch keine Fixkosten eingetragen.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
