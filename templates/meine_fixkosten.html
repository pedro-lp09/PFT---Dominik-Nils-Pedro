<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixkosten Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #4361ee; --bg-color: #f0f2f5; --card-bg: #ffffff; }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; padding-top: 40px; }
        .app-container { max-width: 1000px; margin: auto; }
        .glass-card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; border: none; }
        .date-badge { background: #eef2ff; color: var(--primary-color); padding: 5px 12px; border-radius: 8px; font-size: 0.9rem; }
        .amount-text { font-weight: 700; color: #2b2d42; }
        .btn-delete-icon { color: #ef233c; background: #fff1f2; width: 35px; height: 35px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; text-decoration: none; transition: 0.2s; }
        .btn-delete-icon:hover { background: #ef233c; color: white; }
    </style>
</head>
<body>
<div class="app-container px-3">
    <div class="glass-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold m-0 text-primary">📊 Fixkosten-Planer</h1>
            <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm text-muted">Logout</a>
        </div>

        <form method="POST" class="row g-3 mb-5 p-3 bg-light rounded-4">
            <div class="col-md-4">
                <label class="form-label small fw-bold">Bezeichnung</label>
                <input type="text" name="contents" class="form-control" placeholder="z.B. Miete" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Fälligkeit</label>
                <input type="date" name="due_at" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Betrag (CHF)</label>
                <input type="number" step="0.05" name="amount" class="form-control" placeholder="0.00" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Hinzufügen</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr class="text-muted small">
                        <th>FIXKOSTEN</th>
                        <th>DATUM</th>
                        <th>BETRAG</th>
                        <th class="text-end">AKTION</th>
                    </tr>
                </thead>
                <tbody>
                    {% for todo in todos %}
                    <tr>
                        <td class="fw-bold">{{ todo.content }}</td>
                        <td><span class="date-badge">{{ todo.due if todo.due else todo.due_at }}</span></td>
                        <td><span class="amount-text">{{ "%.2f"|format(todo.amount|float) if todo.amount else "0.00" }} CHF</span></td>
                        <td class="text-end">
                            <a href="{{ url_for('delete', todo_id=todo.id) }}" class="btn-delete-icon" onclick="return confirm('Löschen?')">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="text-center py-5 text-muted small">Keine Einträge vorhanden.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
